name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (bun test, PGlite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # NOT `bun run test` — that is the e2e runner and needs live Celestia +
      # Midnight + Postgres infra (see e2e job below). The unit suites are
      # self-contained: PGlite (in-memory Postgres, wasm) + ledger wasm.
      - name: Run unit suites
        run: >
          bun test
          packages/database
          packages/validator
          packages/node
          packages/offer-guard
          packages/batcher

  typecheck-playground:
    name: Typecheck docs playground (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: tsc -b
        working-directory: docs
        run: bunx tsc -b

  # The full e2e (maker → Celestia → indexer → settle on Midnight) needs the
  # local chain binaries and is NOT run per-PR. Manual trigger only, so the
  # deploy checklist's "run the automated e2e suite" has a button — expected
  # to fail until the runner image ships the chain binaries; runs the same
  # `bun run test` a developer runs locally.
  e2e:
    name: e2e (manual — needs chain infra)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run e2e suite
        run: bun run test
