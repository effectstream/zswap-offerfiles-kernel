name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (bun test, PGlite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Keep CI on the same runtime used by the Docker acceptance suite.
          # `latest` made a green result non-reproducible across reruns.
          bun-version: 1.3.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The focused grand-e2e tests import their live phase to catch runtime
      # loader drift, but never execute the contract. Compact output is
      # gitignored and the compiler is not installed on the runner, so provide
      # only the module surface needed to load that phase. Real/local generated
      # artifacts remain authoritative for every stack-dependent run.
      - name: Stub Compact-generated contract runtime
        run: |
          mkdir -p packages/contracts-midnight/contract-offer-files/src/managed/contract
          printf 'export class Contract {}\nexport function ledger() { return {}; }\nexport const pureCircuits = {};\nexport const contractReferenceLocations = { tag: "publicLedgerArray", indices: {} };\n' \
            > packages/contracts-midnight/contract-offer-files/src/managed/contract/index.js
      - name: Verify pgtyped generated queries
        run: bun run check:pgtypes
      # NOT `bun run test` — that is the e2e runner and needs live Celestia +
      # Midnight + Postgres infra (see e2e job below). The unit suites are
      # self-contained: PGlite (in-memory Postgres, wasm) + ledger wasm.
      #
      # `deploy/scripts/lib` is not a workspace member, so it is easy to forget:
      # its suites cover the deployment scripts' own logic (the offer poster's
      # config, journal, quote sizing, scheduler, health and pinned coin
      # selection) and are self-contained in the same way — no PGlite, no
      # network, no Compact output.
      - name: Run unit suites
        run: >
          bun test
          packages/database
          packages/validator
          packages/node
          packages/offer-guard
          packages/batcher
          packages/solver-core
          packages/solver
          packages/solver-frontend
          packages/tests/grand-e2e
          deploy/scripts/lib

  typecheck-playground:
    name: Typecheck docs playground (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Compile API examples 01, 03, 05, 07, and 11
        run: >
          bun build
          api-examples/01-health.ts
          api-examples/03-offers.ts
          api-examples/05-market.ts
          api-examples/07-events.ts
          api-examples/11-settle-offer.ts
          --target bun
          --outdir "${RUNNER_TEMP}/api-examples"
      # The Compact compiler's output (src/managed/) is gitignored and the
      # compiler isn't on the runner. The playground only needs the module to
      # RESOLVE — stub it as `any` so tsc checks everything else. Local runs
      # with real artifacts are unaffected (this dir only exists here in CI).
      - name: Stub Compact-generated contract artifacts
        run: |
          mkdir -p packages/contracts-midnight/contract-offer-files/src/managed/contract
          printf 'export declare const Contract: any;\nexport type Contract = any;\nexport declare const ledger: any;\nexport declare const pureCircuits: any;\n' \
            > packages/contracts-midnight/contract-offer-files/src/managed/contract/index.d.ts
      - name: tsc -b
        working-directory: docs
        run: bunx tsc -b

  backend-typecheck:
    name: Backend typecheck (strict packages/node only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Compact output is gitignored. Reuse the docs job's declaration-only
      # module boundary so this backend-only gate never depends on generated
      # proof artifacts while checking production packages/node source.
      - name: Stub Compact-generated contract artifacts
        run: |
          mkdir -p packages/contracts-midnight/contract-offer-files/src/managed/contract
          printf 'export declare const Contract: any;\nexport type Contract = any;\nexport declare const ledger: any;\nexport declare const pureCircuits: any;\n' \
            > packages/contracts-midnight/contract-offer-files/src/managed/contract/index.d.ts
      - name: Strict backend-only TypeScript check
        run: bun run typecheck:backend

  solver-typecheck:
    name: Solver typecheck (strict solver, solver-core, validator, solver-frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Same declaration-only Compact boundary as the backend gate: the solver
      # gate must never depend on generated proof artifacts either.
      - name: Stub Compact-generated contract artifacts
        run: |
          mkdir -p packages/contracts-midnight/contract-offer-files/src/managed/contract
          printf 'export declare const Contract: any;\nexport type Contract = any;\nexport declare const ledger: any;\nexport declare const pureCircuits: any;\n' \
            > packages/contracts-midnight/contract-offer-files/src/managed/contract/index.d.ts
      # Production AND test sources of the solver packages, plus
      # packages/solver-frontend (00007 FR-017 — listed, and compiled with its
      # own options because its browser modules are .js) and every first-party
      # file that imports the solver's source (discovered, not listed). Zero
      # diagnostics required — see scripts/solver-typecheck.ts.
      - name: Strict solver TypeScript check
        run: bun run typecheck:solver

  # The full e2e (maker → Celestia → indexer → settle on Midnight) needs the
  # local chain binaries and is NOT run per-PR. Manual trigger only, so the
  # deploy checklist's "run the automated e2e suite" has a button — expected
  # to fail until the runner image ships the chain binaries; runs the same
  # `bun run test` a developer runs locally.
  e2e:
    name: e2e (manual — needs chain infra)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run e2e suite
        run: bun run test
