name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (bun test, PGlite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Keep CI on the same runtime used by the Docker acceptance suite.
          # `latest` made a green result non-reproducible across reruns.
          bun-version: 1.3.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify pgtyped generated queries
        run: bun run check:pgtypes
      # NOT `bun run test` — that is the e2e runner and needs live Celestia +
      # Midnight + Postgres infra (see e2e job below). The unit suites are
      # self-contained: PGlite (in-memory Postgres, wasm) + ledger wasm.
      #
      # `deploy/scripts/lib` is not a workspace member, so it is easy to forget:
      # its suites cover the deployment scripts' own logic (the offer poster's
      # config, journal, quote sizing, scheduler, health and pinned coin
      # selection) and are self-contained in the same way — no PGlite, no
      # network, no Compact output.
      - name: Run unit suites
        run: >
          bun test
          packages/database
          packages/validator
          packages/node
          packages/offer-guard
          packages/batcher
          packages/solver-core
          packages/solver
          packages/solver-frontend
          packages/tests/grand-e2e
          scripts/check-compact-runtime.test.ts
          deploy/scripts/lib

  kernel-image-amd64:
    name: Kernel image amd64 build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KERNEL_IMAGE: k00028-kernel-ci:${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 kernel image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --cache-from type=gha,scope=k00028-kernel-amd64 \
            --cache-to type=gha,mode=max,scope=k00028-kernel-amd64 \
            --file deploy/images/kernel/Dockerfile \
            --tag "$KERNEL_IMAGE" \
            .
      - name: Verify architecture and contract-free runtime image
        run: |
          test "$(docker image inspect "$KERNEL_IMAGE" --format '{{.Architecture}}')" = "amd64"
          docker run --rm --platform linux/amd64 --entrypoint sh "$KERNEL_IMAGE" -lc '
            test ! -e /app/packages/contracts-midnight
            test -f /app/packages/midnight-infra/package.json
          '

  typecheck-playground:
    name: Typecheck docs playground (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Compile API examples 01, 03, 05, 07, and 11
        run: >
          bun build
          api-examples/01-health.ts
          api-examples/03-offers.ts
          api-examples/05-market.ts
          api-examples/07-events.ts
          api-examples/11-settle-offer.ts
          --target bun
          --outdir "${RUNNER_TEMP}/api-examples"
      - name: tsc -b
        working-directory: docs
        run: bunx tsc -b

  backend-typecheck:
    name: Backend typecheck (strict packages/node only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Strict backend-only TypeScript check
        run: bun run typecheck:backend

  solver-typecheck:
    name: Solver typecheck (strict solver, solver-core, validator, solver-frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Production AND test sources of the solver packages, plus
      # packages/solver-frontend (00007 FR-017 — listed, and compiled with its
      # own options because its browser modules are .js) and every first-party
      # file that imports the solver's source (discovered, not listed). Zero
      # diagnostics required — see scripts/solver-typecheck.ts.
      - name: Strict solver TypeScript check
        run: bun run typecheck:solver

  # The full e2e (maker → Celestia → indexer → settle on Midnight) needs chain
  # binaries and externally prefunded wallet inventory, so it is manual only.
  e2e:
    name: e2e (manual — needs chain infra)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run e2e suite
        run: bun run test
